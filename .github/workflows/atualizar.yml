name: Atualizar catálogo

on:
  schedule:
    # Todo dia às 05:47 em Brasília (08:47 UTC; o Brasil não tem horário de verão).
    # Depois das estreias da Netflix (00:00 na Califórnia = 05:00 aqui) e longe
    # do minuto :00, quando o GitHub atrasa mais os agendamentos.
    - cron: '47 8 * * *'
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ['public/**', '!public/data/**']   # mudou a página: só republica

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Coletar prêmios, streaming e notas
        if: github.event_name != 'push'
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: node scripts/build.mjs

      - name: Guardar dados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "Catálogo de $(TZ=America/Sao_Paulo date +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
